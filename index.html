<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tunebox">
<meta name="theme-color" content="#121110">
<title>Tunebox</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23ff5a36'/%3E%3Ccircle cx='70' cy='122' r='26' fill='%23121110'/%3E%3Crect x='88' y='38' width='14' height='86' fill='%23121110'/%3E%3Cpath d='M102 38c20 6 34 16 38 36-12-10-24-12-38-12z' fill='%23121110'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#faf7f2,#121110);--card:light-dark(#fff,#1d1b19);--line:light-dark(#e8e2d8,#2c2926);--ink:light-dark(#1b1a17,#f3efe8);--mute:light-dark(#6f6a62,#a49d93);--acc:#ff5a36;--acc-ink:#fff}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Outfit,system-ui,-apple-system,sans-serif;overflow-x:clip}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:8px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 14px) 18px 10px}
h1{margin:0;font-size:32px;line-height:1.05;font-weight:800;letter-spacing:-.02em}
h1 span{color:var(--acc)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.icon{width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.icon svg{width:24px;height:24px}
.search{display:flex;gap:8px;margin-top:12px}
.search input{flex:1;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:0 16px;font-size:16px}
.btn{height:48px;padding:0 18px;border-radius:14px;background:var(--acc);color:var(--acc-ink);font-weight:700;white-space:nowrap}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sm{height:40px;padding:0 14px;font-size:15px}
main{padding:4px 18px calc(env(safe-area-inset-bottom) + 330px)}
h2{font-size:22px;margin:18px 0 8px;font-weight:700}
.note{color:var(--mute);font-size:14px;margin:6px 0}
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.row img{width:64px;height:48px;object-fit:cover;border-radius:8px;background:var(--line);flex:none}
.row .meta{flex:1;cursor:pointer}
.row .t{font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25}
.row .c{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.on .t{color:var(--acc)}
.row .icon{width:40px;height:40px;flex:none;color:var(--mute)}
.row .icon.fav{color:var(--acc)}
.pl{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--card);margin-bottom:10px;cursor:pointer}
.pl .art{width:56px;height:56px;border-radius:12px;background:var(--acc);display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px;flex:none;overflow:hidden}
.pl .art img{width:100%;height:100%;object-fit:cover}
.pl .meta{flex:1}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.empty{padding:40px 10px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--mute)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-selected=true]{color:var(--acc)}
/* player */
#player-wrap{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:6;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -8px 30px rgba(0,0,0,.12);display:none}
#player-wrap.show{display:block}
.vid{position:relative;width:100%;max-width:520px;margin:0 auto;aspect-ratio:16/9;background:#000}
.vid>div,.vid iframe{position:absolute;inset:0;width:100%;height:100%}
#player-wrap.mini .vid{width:200px;margin:0;float:left;margin-right:12px}
.pctl{padding:10px 16px 12px;max-width:520px;margin:0 auto}
#player-wrap.mini .pctl{padding:8px 12px 8px 0;overflow:hidden}
.now{font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowc{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;margin-top:6px}
.time input{flex:1;accent-color:var(--acc);height:24px}
.ctl{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.ctl .icon.big{width:56px;height:56px;background:var(--acc);color:#fff}
.ctl .icon.big svg{width:30px;height:30px}
.ctl .icon.lit{color:var(--acc)}
#player-wrap.mini .time,#player-wrap.mini .ctl .side{display:none}
#player-wrap.mini .ctl{justify-content:flex-start;gap:4px}
#player-wrap.mini .ctl .icon.big{width:44px;height:44px}
.badge{font-size:10px;font-weight:800;position:absolute;margin:16px 0 0 18px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
.scrim.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 20px);max-height:85vh;overflow:auto}
.sheet h3{margin:0 0 10px;font-size:22px}
.sheet .opt{width:100%;text-align:left;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);margin-bottom:8px;font-weight:500}
.sheet input,.sheet textarea{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-size:16px;margin:6px 0 12px}
.sheet textarea{height:120px;padding:12px;font-size:13px}
.sheet .bar{justify-content:flex-end}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 16px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:30;font-weight:500;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Tune<span>box</span></h1>
    <button class="icon" id="settings-btn" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
  <form class="search" id="search-form" autocomplete="off">
    <input id="q" type="search" placeholder="Search songs or paste a YouTube link" enterkeyhint="search">
    <button class="btn" type="submit">Search</button>
  </form>
</header>

<main id="view"></main>

<div id="player-wrap">
  <div class="vid"><div id="yt"></div></div>
  <div class="pctl">
    <div style="display:flex;align-items:center;gap:8px">
      <div style="flex:1;overflow:hidden"><div class="now" id="now-t">Nothing playing</div><div class="nowc" id="now-c"></div></div>
      <button class="icon" id="now-fav" aria-label="Favorite"></button>
      <button class="icon" id="mini-btn" aria-label="Shrink player"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button>
    </div>
    <div class="time"><span id="t-cur">0:00</span><input type="range" id="seek" min="0" max="100" value="0" step="1" aria-label="Seek"><span id="t-dur">0:00</span></div>
    <div class="ctl">
      <button class="icon side" id="shuf" aria-label="Shuffle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
      <button class="icon" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button class="icon big" id="play" aria-label="Play or pause"></button>
      <button class="icon" id="next" aria-label="Next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
      <button class="icon side" id="rep" aria-label="Repeat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m17 2 4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg><span class="badge" id="rep-one"></span></button>
    </div>
  </div>
</div>

<nav class="tabs" role="tablist">
  <button role="tab" data-tab="search" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>Search</button>
  <button role="tab" data-tab="favs" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>Favorites</button>
  <button role="tab" data-tab="lists" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h13M3 12h13M3 18h8"/><circle cx="18" cy="17" r="3"/><path d="M21 17V5"/></svg>Playlists</button>
</nav>

<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
{
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const I = {
  heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>',
  heartF:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m18 15-6-6-6 6"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>'
};

/* ---------- storage ---------- */
const KEY = 'tunebox.v1';
let db = { apiKey:'', songs:{}, favs:[], lists:[] };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) db = Object.assign(db, s); } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e) { toast('Could not save on this device'); } };
const remember = s => { const old = db.songs[s.id] || {}; db.songs[s.id] = { id:s.id, title:s.title || old.title || 'YouTube video', channel:s.channel || old.channel || '' }; };
const song = id => db.songs[id] || { id, title:'YouTube video', channel:'' };
const thumb = id => `https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
const isFav = id => db.favs.includes(id);

let tab = 'search', results = [], openList = null, searchNote = '';
let queue = [], qi = -1, shuffle = false, repeat = 0; // 0 off, 1 all, 2 one
let player = null, ready = false, pendingId = null, playing = false;

function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('show'),1800); }

/* ---------- rendering ---------- */
function rowHTML(id, ctx, idx){
  const s = song(id), on = queue[qi] === id;
  return `<li class="row${on?' on':''}" data-id="${esc(id)}">
    <img src="${thumb(id)}" alt="" loading="lazy">
    <div class="meta" data-act="play" data-ctx="${ctx}" data-i="${idx}"><div class="t">${esc(s.title)}</div><div class="c">${esc(s.channel)}</div></div>
    <button class="icon${isFav(id)?' fav':''}" data-act="fav" aria-label="Favorite">${isFav(id)?I.heartF:I.heart}</button>
    ${ctx==='list' ? `<button class="icon" data-act="more" data-i="${idx}" aria-label="Song options">${I.down}</button>` : `<button class="icon" data-act="add" aria-label="Add to playlist">${I.plus}</button>`}
  </li>`;
}

function render(){
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  const v = $('#view');
  if (tab === 'search') {
    v.innerHTML = results.length
      ? `<h2>Results</h2>${searchNote?`<p class="note">${esc(searchNote)}</p>`:''}<ul class="list">${results.map((id,i)=>rowHTML(id,'search',i)).join('')}</ul>`
      : `<div class="empty"><b>Find something to play</b>${db.apiKey ? 'Type a song or artist above.' : 'Paste a YouTube link above, or add a free YouTube API key in Settings to search by name.'}${searchNote?`<p class="note">${esc(searchNote)}</p>`:''}</div>`;
  } else if (tab === 'favs') {
    v.innerHTML = db.favs.length
      ? `<h2>Favorites</h2><div class="bar"><button class="btn sm" data-act="playall" data-src="favs">Play all</button><button class="btn sm ghost" data-act="shuffleall" data-src="favs">Shuffle</button></div><ul class="list">${db.favs.map((id,i)=>rowHTML(id,'favs',i)).join('')}</ul>`
      : `<div class="empty"><b>No favorites yet</b>Tap the heart on any song.</div>`;
  } else if (openList) {
    const p = db.lists.find(l => l.id === openList);
    if (!p) { openList = null; return render(); }
    v.innerHTML = `<h2>${esc(p.name)}</h2><p class="note">${p.songs.length} song${p.songs.length===1?'':'s'}</p>
      <div class="bar"><button class="btn sm" data-act="playall" data-src="list">Play all</button><button class="btn sm ghost" data-act="shuffleall" data-src="list">Shuffle</button><button class="btn sm ghost" data-act="rename">Rename</button><button class="btn sm ghost" data-act="dellist">Delete</button><button class="btn sm ghost" data-act="back">Back</button></div>
      ${p.songs.length ? `<ul class="list">${p.songs.map((id,i)=>rowHTML(id,'list',i)).join('')}</ul>` : `<div class="empty"><b>Empty playlist</b>Search for songs and tap + to add them here.</div>`}`;
  } else {
    v.innerHTML = `<h2>Playlists</h2><div class="bar"><button class="btn sm" data-act="newlist">New playlist</button></div>
      ${db.lists.length ? db.lists.map(l => `<div class="pl" data-act="openlist" data-lid="${l.id}"><div class="art">${l.songs[0]?`<img src="${thumb(l.songs[0])}" alt="">`:esc(l.name[0]||'♪')}</div><div class="meta"><div class="t" style="font-weight:700">${esc(l.name)}</div><div class="c" style="color:var(--mute);font-size:13px">${l.songs.length} songs</div></div></div>`).join('')
      : `<div class="empty"><b>No playlists yet</b>Create one, then add songs with the + button.</div>`}`;
  }
  renderNow();
}

function renderNow(){
  const id = queue[qi];
  if (id) { const s = song(id); $('#now-t').textContent = s.title; $('#now-c').textContent = s.channel; }
  $('#now-fav').innerHTML = id && isFav(id) ? I.heartF : I.heart;
  $('#now-fav').style.color = id && isFav(id) ? 'var(--acc)' : '';
  $('#play').innerHTML = playing ? I.pause : I.play;
  $('#shuf').classList.toggle('lit', shuffle);
  $('#rep').classList.toggle('lit', repeat > 0);
  $('#rep-one').textContent = repeat === 2 ? '1' : '';
}

/* ---------- sheets ---------- */
function sheet(html){ $('#sheet').innerHTML = html; $('#scrim').classList.add('show'); }
function closeSheet(){ $('#scrim').classList.remove('show'); }
$('#scrim').addEventListener('click', e => { if (e.target.id === 'scrim') closeSheet(); });

function askName(title, value, done){
  sheet(`<h3>${esc(title)}</h3><form id="nf"><input id="nm" value="${esc(value)}" placeholder="Playlist name" maxlength="60"><div class="bar"><button type="button" class="btn ghost" id="nc">Cancel</button><button class="btn">Save</button></div></form>`);
  const inp = $('#nm'); inp.focus();
  $('#nc').onclick = closeSheet;
  $('#nf').onsubmit = e => { e.preventDefault(); const n = inp.value.trim(); if (!n) return; closeSheet(); done(n); };
}

function newList(name, firstId){
  const l = { id: 'p' + Date.now().toString(36), name, songs: firstId ? [firstId] : [] };
  db.lists.push(l); save(); return l;
}

function addToListSheet(id){
  const s = song(id);
  sheet(`<h3>Add to playlist</h3><p class="note">${esc(s.title)}</p>
    ${db.lists.map(l => `<button class="opt" data-lid="${l.id}">${esc(l.name)} <span style="color:var(--mute)">· ${l.songs.length}</span>${l.songs.includes(id)?' <span style="color:var(--acc)">✓ added</span>':''}</button>`).join('')}
    <button class="opt" id="mk" style="color:var(--acc)">+ New playlist</button>`);
  $('#sheet').querySelectorAll('[data-lid]').forEach(b => b.onclick = () => {
    const l = db.lists.find(x => x.id === b.dataset.lid);
    if (!l.songs.includes(id)) { l.songs.push(id); save(); toast('Added to ' + l.name); } else toast('Already in ' + l.name);
    closeSheet(); render();
  });
  $('#mk').onclick = () => askName('New playlist', '', n => { newList(n, id); toast('Added to ' + n); render(); });
}

function songMenu(idx){
  const p = db.lists.find(l => l.id === openList); const id = p.songs[idx];
  sheet(`<h3>${esc(song(id).title)}</h3>
    <button class="opt" id="o-up">Move up</button><button class="opt" id="o-dn">Move down</button>
    <button class="opt" id="o-add">Add to another playlist</button>
    <button class="opt" id="o-rm" style="color:var(--acc)">Remove from this playlist</button>`);
  const mv = d => { const j = idx + d; if (j < 0 || j >= p.songs.length) return closeSheet(); [p.songs[idx], p.songs[j]] = [p.songs[j], p.songs[idx]]; save(); closeSheet(); render(); };
  $('#o-up').onclick = () => mv(-1); $('#o-dn').onclick = () => mv(1);
  $('#o-add').onclick = () => addToListSheet(id);
  $('#o-rm').onclick = () => { p.songs.splice(idx, 1); save(); closeSheet(); render(); };
}

function settings(){
  sheet(`<h3>Settings</h3>
    <label for="k" style="font-weight:500">YouTube API key (for search by name)</label>
    <input id="k" value="${esc(db.apiKey)}" placeholder="AIza…" autocapitalize="off" autocorrect="off" spellcheck="false">
    <p class="note">Free from Google Cloud Console → enable “YouTube Data API v3” → Credentials → API key. It stays on this phone only.</p>
    <div class="bar"><button class="btn" id="ks">Save key</button></div>
    <h3 style="margin-top:18px">Back up your library</h3>
    <p class="note">Your favorites and playlists live on this phone. Save a backup now and then.</p>
    <div class="bar" style="justify-content:flex-start"><button class="btn ghost sm" id="exp">Download backup</button><button class="btn ghost sm" id="cp">Copy backup text</button><label class="btn ghost sm" style="display:inline-grid;place-items:center">Restore from file<input type="file" id="imp" accept=".json,application/json" hidden></label></div>
    <textarea id="paste" placeholder="…or paste backup text here and tap Restore"></textarea>
    <div class="bar"><button class="btn ghost" id="pr">Restore</button><button class="btn ghost" id="sc">Close</button></div>`);
  $('#ks').onclick = () => { db.apiKey = $('#k').value.trim(); save(); closeSheet(); toast(db.apiKey ? 'Key saved' : 'Key removed'); render(); };
  const data = () => JSON.stringify({ songs:db.songs, favs:db.favs, lists:db.lists });
  $('#exp').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data()],{type:'application/json'})); a.download = 'tunebox-backup.json'; a.click(); };
  $('#cp').onclick = async () => { try { await navigator.clipboard.writeText(data()); toast('Backup copied'); } catch(e) { $('#paste').value = data(); toast('Copy the text below'); } };
  const restore = txt => { try { const d = JSON.parse(txt); if (!d || !Array.isArray(d.favs) || !Array.isArray(d.lists)) throw 0; db.songs = d.songs || {}; db.favs = d.favs; db.lists = d.lists; save(); closeSheet(); toast('Library restored'); render(); } catch(e) { toast('That backup could not be read'); } };
  $('#imp').onchange = e => { const f = e.target.files[0]; if (f) f.text().then(restore); };
  $('#pr').onclick = () => restore($('#paste').value);
  $('#sc').onclick = closeSheet;
}

/* ---------- search ---------- */
function parseId(s){
  const m = s.match(/(?:youtu\.be\/|v=|\/shorts\/|\/embed\/|\/live\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : (/^[A-Za-z0-9_-]{11}$/.test(s) ? s : null);
}
async function search(q){
  q = q.trim(); if (!q) return;
  tab = 'search'; openList = null;
  const id = parseId(q);
  if (id) { remember({ id }); results = [id]; searchNote = 'Added from link — the title fills in once it plays.'; render(); play([id], 0); return; }
  if (!db.apiKey) { searchNote = ''; render(); settings(); toast('Add an API key to search by name'); return; }
  searchNote = 'Searching…'; results = []; render();
  try {
    const u = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&maxResults=25&q=${encodeURIComponent(q)}&key=${encodeURIComponent(db.apiKey)}`;
    const r = await fetch(u); const j = await r.json();
    if (j.error) throw new Error(j.error.message);
    const txt = document.createElement('textarea');
    const dec = s => (txt.innerHTML = s, txt.value);
    results = (j.items || []).map(it => { const s = { id: it.id.videoId, title: dec(it.snippet.title), channel: dec(it.snippet.channelTitle) }; remember(s); return s.id; });
    save(); searchNote = results.length ? '' : 'No results.';
  } catch(e) { searchNote = 'Search failed: ' + e.message; }
  render();
}
$('#search-form').addEventListener('submit', e => { e.preventDefault(); $('#q').blur(); search($('#q').value); });

/* ---------- player ---------- */
window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player('yt', {
    width:'100%', height:'100%',
    playerVars:{ playsinline:1, rel:0, modestbranding:1, origin: location.origin },
    events:{
      onReady:() => { ready = true; if (pendingId) { player.loadVideoById(pendingId); pendingId = null; } },
      onStateChange: e => {
        playing = e.data === YT.PlayerState.PLAYING;
        if (playing) { const d = player.getVideoData(); const id = queue[qi]; if (d && id && (!db.songs[id] || db.songs[id].title === 'YouTube video') && d.title) { remember({ id, title:d.title, channel:d.author }); save(); render(); } }
        if (e.data === YT.PlayerState.ENDED) next(true);
        renderNow();
      },
      onError:() => { toast('This video can’t play here — skipping'); setTimeout(() => next(true), 800); }
    }
  });
};
const tag = document.createElement('script'); tag.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(tag);

function load(id){
  $('#player-wrap').classList.add('show');
  if (ready) player.loadVideoById(id); else pendingId = id;
  render();
}
function play(list, i){
  queue = list.slice(); qi = i;
  if (shuffle) { const cur = queue.splice(i,1)[0]; queue.sort(() => Math.random() - .5); queue.unshift(cur); qi = 0; }
  load(queue[qi]);
}
function next(auto){
  if (!queue.length) return;
  if (auto && repeat === 2) return load(queue[qi]);
  if (qi < queue.length - 1) qi++;
  else if (repeat === 1 || !auto) qi = 0;
  else { playing = false; return renderNow(); }
  load(queue[qi]);
}
function prev(){
  if (!queue.length) return;
  if (ready && player.getCurrentTime() > 3) return player.seekTo(0, true);
  qi = qi > 0 ? qi - 1 : queue.length - 1; load(queue[qi]);
}
$('#play').onclick = () => { if (!ready || qi < 0) return; playing ? player.pauseVideo() : player.playVideo(); };
$('#next').onclick = () => next(false);
$('#prev').onclick = prev;
$('#shuf').onclick = () => { shuffle = !shuffle; toast(shuffle ? 'Shuffle on' : 'Shuffle off'); renderNow(); };
$('#rep').onclick = () => { repeat = (repeat + 1) % 3; toast(['Repeat off','Repeat all','Repeat one'][repeat]); renderNow(); };
$('#now-fav').onclick = () => { const id = queue[qi]; if (id) toggleFav(id); };
$('#mini-btn').onclick = () => { const w = $('#player-wrap'); w.classList.toggle('mini'); $('#mini-btn').innerHTML = w.classList.contains('mini') ? I.up : I.down; };
$('#mini-btn').innerHTML = I.down;

const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
let seeking = false;
const seek = $('#seek');
seek.addEventListener('input', () => { seeking = true; $('#t-cur').textContent = fmt(seek.value); });
seek.addEventListener('change', () => { if (ready) player.seekTo(+seek.value, true); seeking = false; });
setInterval(() => {
  if (!ready || seeking || qi < 0 || !player.getDuration) return;
  const d = player.getDuration(), c = player.getCurrentTime();
  seek.max = Math.max(1, Math.floor(d)); seek.value = Math.floor(c);
  $('#t-cur').textContent = fmt(c); $('#t-dur').textContent = fmt(d);
}, 500);

/* ---------- actions ---------- */
function toggleFav(id){
  const i = db.favs.indexOf(id);
  if (i >= 0) { db.favs.splice(i,1); toast('Removed from favorites'); } else { db.favs.unshift(id); toast('Added to favorites'); }
  save(); render();
}
function srcList(src){ return src === 'favs' ? db.favs : src === 'list' ? (db.lists.find(l => l.id === openList) || {songs:[]}).songs : results; }

$('#view').addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, row = el.closest('.row'), id = row && row.dataset.id;
  if (act === 'play') { const ctx = el.dataset.ctx; play(srcList(ctx === 'search' ? 'search' : ctx), +el.dataset.i); }
  else if (act === 'fav') toggleFav(id);
  else if (act === 'add') addToListSheet(id);
  else if (act === 'more') songMenu(+el.dataset.i);
  else if (act === 'playall' || act === 'shuffleall') { const l = srcList(el.dataset.src); if (!l.length) return; shuffle = act === 'shuffleall'; play(l, shuffle ? Math.floor(Math.random()*l.length) : 0); }
  else if (act === 'newlist') askName('New playlist', '', n => { newList(n); render(); });
  else if (act === 'openlist') { openList = el.dataset.lid; render(); window.scrollTo(0,0); }
  else if (act === 'back') { openList = null; render(); }
  else if (act === 'rename') { const p = db.lists.find(l => l.id === openList); askName('Rename playlist', p.name, n => { p.name = n; save(); render(); }); }
  else if (act === 'dellist') {
    const p = db.lists.find(l => l.id === openList);
    sheet(`<h3>Delete “${esc(p.name)}”?</h3><p class="note">The songs stay in your favorites and other playlists.</p><div class="bar"><button class="btn ghost" id="dc">Cancel</button><button class="btn" id="dy">Delete</button></div>`);
    $('#dc').onclick = closeSheet;
    $('#dy').onclick = () => { db.lists = db.lists.filter(l => l.id !== p.id); openList = null; save(); closeSheet(); render(); };
  }
});
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.tab; if (tab !== 'lists') openList = null; render(); window.scrollTo(0,0); });
$('#settings-btn').onclick = settings;

render();
}
</script>
</body>
</html>
